name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with flake8
        # select=E9,F: syntax errors + pyflakes (undefined names, unused imports).
        # Style rules (W293, E501) are deferred — see setup.cfg for full config.
        run: |
          flake8 \
            media_inspect.py compare_core.py config.py models.py \
            orchestrator.py llm_polish.py srt_writer.py \
            audio_utils.py subtitle_utils.py asr.py mt.py \
            tracing.py batch_process.py benchmark.py \
            --select=E9,F --extend-ignore=F401,F841 --exclude venv

      - name: Run unit tests
        run: pytest -v --tb=short -m "not integration"
