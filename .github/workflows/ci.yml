name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with flake8
        # select=E9,F: syntax errors + pyflakes (undefined names, unused imports).
        # Style rules (W293, E501) are deferred — see setup.cfg for full config.
        # The legacy root shims were deleted; lint current runtime modules instead.
        run: |
          python - <<'PY' > /tmp/flake8-targets.txt
          from pathlib import Path

          targets = [
              "main.py",
              "batch_process.py",
              "compare_srt.py",
              "example_usage.py",
              "llm_translate.py",
              "subtitle_corrector.py",
              "subtitle_qc.py",
              "translation_qc.py",
              "core",
              "packs",
          ]

          for target in targets:
              if Path(target).exists():
                  print(target)
          PY
          xargs flake8 --select=E9,F --extend-ignore=F401,F841 --exclude venv < /tmp/flake8-targets.txt

      - name: Run unit tests
        run: pytest -v --tb=short -m "not integration"
