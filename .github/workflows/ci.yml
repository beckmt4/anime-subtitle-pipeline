name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with flake8
        # select=E9,F: syntax errors + pyflakes (undefined names, unused imports).
        # Style rules (W293, E501) are deferred — see setup.cfg for full config.
        run: |
          flake8 \
            core/media/__init__.py core/benchmark/compare_core.py core/runtime/config.py core/subtitles/models.py \
            core/runtime/orchestrator.py core/polish/__init__.py core/subtitles/srt_writer.py \
            core/extract/audio_utils.py core/extract/subtitle_utils.py core/asr/__init__.py core/mt/__init__.py \
            core/runtime/tracing.py core/runtime/batch_process.py core/benchmark/__init__.py \
            --select=E9,F --extend-ignore=F401,F841 --exclude venv

      - name: Run unit tests
        run: pytest -v --tb=short -m "not integration"
