# ============================================================================
# Anime Subtitle Pipeline Configuration
# ============================================================================
# This configuration file controls all aspects of the subtitle generation
# pipeline. Use different profiles for dev (6GB GPU) vs prod (24GB GPU).
# ============================================================================

# Runtime profile selection: "dev" or "prod"
# - dev: Optimized for NVIDIA RTX A3000 6GB (quantized models, smaller batches)
# - prod: Optimized for NVIDIA RTX 4090 24GB (FP16, larger batches)
runtime:
  profile: "prod"  # dev = A3000 6GB laptop | prod = RTX 4090 workstation

# Directory paths
paths:
  inbox: "./inbox"           # Input video files
  outbox: "./outbox"         # Output SRT and muxed videos
  logs: "./logs"             # JSON logs with segment data
  temp: "./temp"             # Temporary audio files

# ASR (Automatic Speech Recognition) - Faster-Whisper
asr:
  model_name: "large-v3"         # Whisper model variant
  device: "cuda"                 # auto | cuda | cpu
  
  # Dev profile settings (6GB GPU)
  dev:
    compute_type: "int8_float16"  # Quantized for memory efficiency
    beam_size: 5
    batch_size: 8

  # Prod profile settings (RTX 4090 23GB — large-v3 FP16 uses ~4GB, leaves 19GB headroom)
  prod:
    compute_type: "float16"       # Full precision FP16
    beam_size: 5
    batch_size: 32
  
  # Common settings
  vad_filter: true                # Enable voice activity detection
  vad_parameters:
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 500

  # Practical ASR quality diagnostics. These are warning thresholds, not hard
  # stops; generate mode surfaces them in metadata and QC findings.
  quality:
    warn_no_speech_prob_above: 0.60
    warn_avg_logprob_below: -1.00
    warn_compression_ratio_above: 2.40
    warn_min_duration_sec: 0.25
    warn_max_duration_sec: 12.0
    warn_gap_sec: 6.0
    warn_repeated_text_count: 3
    warn_japanese_char_ratio_below: 0.20
    fail_low_confidence_ratio: 0.50

  language: "ja"                  # Japanese audio
  task: "transcribe"              # transcribe (not translate)

# Audio selection preferences (for multi-track files)
audio:
  preferred_languages: ["ja", "jpn", "ja-JP", "en"]  # priority order for selection

# Machine Translation - Helsinki-NLP MarianMT
mt:
  model_name: "Helsinki-NLP/opus-mt-ja-en"
  device: "cpu"                   # MT runs on CPU to save VRAM
  batch_size: 16                  # Process multiple segments at once
  max_length: 512                 # Maximum token length per segment

# Translation engine selector. MarianMT remains the offline-safe baseline;
# llm_direct and hybrid use the Ollama-compatible LLM settings below.
translation:
  engine: "marian"                # marian | llm_direct | hybrid
  fallback_engine: "marian"       # used when llm_direct/hybrid fails
  context_window_segments: 4      # previous/next source segments in LLM prompt
  mode: "accuracy_first"          # literal | natural_subtitle | accuracy_first
  dialogue_profile: "default"     # default | live_action_adult
  preserve_adult_register: false
  flag_low_confidence: false
  flag_high_risk_content: false
  timeout: 60                     # seconds for LLM direct translation calls
  workflow: "single_pass"         # single_pass | literal_then_natural
  save_intermediate: false        # save literal-pass segments in candidate metadata
  profiles:
    live_action_adult:
      engine: "llm_direct"
      workflow: "literal_then_natural"
      mode: "accuracy_first"
      context_window_segments: 6
      preserve_adult_register: true
      flag_low_confidence: true
      flag_high_risk_content: true

# LLM Polishing (Optional)
llm:
  enabled: true                   # Set to false to skip LLM polishing
  base_url: "http://localhost:11434"  # Ollama-compatible API endpoint
  
  # Model selection by profile
  dev:
    model_name: "qwen2.5:14b-instruct"  # 14B instruct, 9GB — installed locally
  prod:
    model_name: "qwen2.5:32b"           # 32B Q4, 19GB — fits 4090 23GB after ASR unloads
  
  style: "natural"                # "natural" | "literal"
  
  # Subtitle formatting constraints
  max_lines: 2
  max_chars_per_line: 42
  
  # Request parameters
  timeout: 30                     # HTTP timeout in seconds
  temperature: 0.3                # Lower = more deterministic
  top_p: 0.9
  
  # System prompt templates by style
  prompts:
    natural: |
      You are a professional anime subtitle editor. Your task is to improve machine-translated English subtitles to sound natural while preserving the original meaning.

      Rules:
      1. DO NOT change the meaning or add content not in the original.
      2. Keep it to {max_lines} lines maximum, ~{max_chars_per_line} characters per line.
      3. Use natural, conversational English suitable for anime viewers.
      4. Preserve character personality and tone, but do not make the line more dramatic.
      5. Do not infer missing context, add new ideas, or rewrite a simple statement into a different action.
      6. Use contractions and informal language only when they preserve the same meaning.
      7. Your output must contain ONLY English text using standard ASCII characters and punctuation. Do NOT include Chinese, Japanese, Korean, or any other non-Latin characters under any circumstances.
      8. ONLY return the improved English subtitle text, nothing else.

    literal: |
      You are a professional subtitle editor. Your task is to clean up machine-translated English subtitles while staying as close to the Japanese phrasing as possible.

      Rules:
      1. DO NOT change the meaning or add content not in the original.
      2. Keep it to {max_lines} lines maximum, ~{max_chars_per_line} characters per line.
      3. Fix only grammar and awkward phrasing, but preserve Japanese sentence structure.
      4. Keep honorifics and cultural terms when important.
      5. Your output must contain ONLY English text using standard ASCII characters and punctuation. Do NOT include Chinese, Japanese, Korean, or any other non-Latin characters under any circumstances. Romanize honorifics (e.g., "san", "sensei") instead of using kanji/kana.
      6. ONLY return the improved English subtitle text, nothing else.

    natural_from_literal: |
      You are a professional subtitle editor. You are given a literal English translation of Japanese dialogue. Your task is to adapt it into natural, readable subtitle text while preserving its exact meaning.

      Rules:
      1. Keep the exact meaning from the literal translation — do NOT add, remove, soften, or change any content.
      2. Make the phrasing natural and conversational in English.
      3. Keep to {max_lines} lines maximum, ~{max_chars_per_line} characters per line.
      4. Preserve all names, honorifics, and cultural terms from the literal translation.
      5. Preserve register and tone — if the literal translation is blunt or formal, keep it that way.
      6. Your output must contain ONLY English text using standard ASCII characters and punctuation. Do NOT include Chinese, Japanese, Korean, or any other non-Latin characters under any circumstances.
      7. ONLY return the adapted English subtitle text, nothing else.

# Subtitle formatting
subtitles:
  format: "srt"                   # Output format (only SRT for now)

  # Timing constraints
  min_duration_sec: 0.5           # Minimum subtitle duration
  max_duration_sec: 7.0           # Maximum subtitle duration
  min_gap_sec: 0.05               # Minimum gap between adjacent cues
  
  # Split long segments at these punctuation marks
  split_on_punctuation: [".", "!", "?", ";"]
  
  # Target segment length for splitting (characters)
  target_split_length: 80

# Video muxing (optional)
mux:
  enabled: false                  # Set to true to mux SRT into video
  output_suffix: "en"             # Output: video.en.mkv
  subtitle_language: "eng"        # Metadata language code
  subtitle_title: "English"       # Subtitle track title

# Logging
logging:
  level: "INFO"                   # DEBUG | INFO | WARNING | ERROR
  save_segment_json: true         # Save detailed JSON logs
  console_progress: true          # Show progress bars

# Generation mode strategy configuration
# Read by orchestrator.run_generate via cfg.get("generate", ...).
# This is a TOP-LEVEL key; previously it was nested under benchmark:
# which caused the orchestrator to silently fall back to defaults.
generate:
  prefer_subtitles: true          # If true, prefer existing English subtitles over audio
  prefer_audio_language: "auto"   # "en" | "ja" | "auto" (auto chooses EN if available else JA)
  use_llm_polish: true            # Apply LLM polishing when path involves MT

# Benchmark mode candidate generation.
benchmark:
  translation_engines: ["marian"] # compare e.g. ["marian", "llm_direct", "hybrid"]
  sources:
    use_embedded_en: true
    use_embedded_jp: true
    use_en_audio: true
    use_ja_audio: true
  reference_priority:
    - embedded_en
    - en_audio_asr
    - ja_audio_asr_mt
    - embedded_jp_mt
  compare_all_pairs: false
  max_diffs_per_comparison: 20

# Quality routing policy
# Used by core.policy.PolicyEngine to route generate-mode outputs.
# Candidates with a total_score below review_score_threshold are routed to
# the review state; those below reject_score_threshold are rejected outright.
# Strategies that involve machine translation (embedded_jp_mt, ja_audio_asr_mt,
# untagged_audio_asr_mt) are always routed to review regardless of score.
policy:
  routing:
    review_score_threshold: 60   # Route to review when score < this value
    reject_score_threshold: 20   # Route to reject when score < this value
    asr_warning_review_density: 0.10  # Review when ASR warnings affect >=10% of cues

# Subtitle QC validation
# Applied automatically after generate mode writes the output SRT.
# All thresholds are used as arguments to subtitle_qc.run_qc().
#
# Threshold        Default  Attribute              Ration
